apply plugin: 'com.android.library'
group = 'com.github.nizwar'

android {
    // بالا برده شد از ۳۳: مقدارِ "specialUse" برای foregroundServiceType
    // (که سرویسِ OpenVPNService بهش نیاز داره، چون از Android 14+ هر
    // foreground service باید یه type اعلام کنه) تو attrs پلتفرمِ ۳۳ اصلاً
    // تعریف نشده -- AAPT با کامپایلِ ۳۳ ردش می‌کنه.
    compileSdk 34
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        ndkVersion "22.1.7171670"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // official's app.build.gradle defines these via product flavors
        // (skeleton/ui) and an openvpn3 feature flag -- this module has
        // neither, so declare them directly. FLAVOR MUST be "skeleton":
        // NativeUtils's static initializer loads libosslspeedtest.so
        // unless FLAVOR=="skeleton", and that .so is not bundled in
        // jniLibs/ here -- any other value crashes with
        // UnsatisfiedLinkError the first time this class loads.
        // openvpn3=false matches VpnProfile's check since this module
        // never bundled the OpenVPN3 core.
        buildConfigField "String", "FLAVOR", '"skeleton"'
        buildConfigField "boolean", "openvpn3", "false"
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        // بالا برده شد از ۱٫۸: کدِ رسمیِ ics-openvpn (که این فورک الان
        // مبتنی بریشه) از سینتکسِ switch-expression (نیازمندِ جاوا ۱۴+)
        // استفاده می‌کنه.
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'androidx.appcompat:appcompat:1.6.0'
}
